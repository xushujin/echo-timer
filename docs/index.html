<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EchoTimer 天梯榜</title>
<style>
  :root {
    --bg: #eef1f5;
    --card: #f4f6f9;
    --text: #1f242b;
    --muted: #5b6673;
    --accent: #2b5fd9;
    --danger: #b3261e;
    --line: rgba(0, 0, 0, .08);
    --shadow-dark: rgba(163, 177, 198, .55);
    --shadow-light: rgba(255, 255, 255, .95);
    --radius: 20px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1b1f24;
      --card: #22262c;
      --text: #eef2f7;
      --muted: #a3aebc;
      --accent: #7aa2ff;
      --danger: #ff8a80;
      --line: rgba(255, 255, 255, .08);
      --shadow-dark: rgba(0, 0, 0, .55);
      --shadow-light: rgba(255, 255, 255, .06);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 28px 18px 56px;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.55 -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 760px; margin: 0 auto; }
  header { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 22px; }
  h1 { margin: 0; font-size: 26px; letter-spacing: .04em; }
  .sub { color: var(--muted); font-size: 12.5px; margin-top: 6px; word-break: break-all; }
  .sub a { color: var(--accent); text-decoration: none; }
  .sub a:hover { text-decoration: underline; }
  .spacer { flex: 1; }
  button {
    font: inherit; color: var(--text); cursor: pointer;
    background: var(--card); border: 0; border-radius: 14px;
    padding: 9px 16px; box-shadow: 4px 4px 10px var(--shadow-dark), -4px -4px 10px var(--shadow-light);
  }
  button:active { box-shadow: inset 3px 3px 8px var(--shadow-dark), inset -3px -3px 8px var(--shadow-light); }
  button[disabled] { opacity: .5; cursor: default; }
  .card {
    background: var(--card); border-radius: var(--radius); padding: 18px 18px 14px;
    box-shadow: 8px 8px 20px var(--shadow-dark), -8px -8px 20px var(--shadow-light);
    margin-bottom: 18px;
  }
  .board-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 10px; }
  .board-name { font-size: 17px; font-weight: 600; }
  .board-meta { color: var(--muted); font-size: 12px; }
  .rows { display: flex; flex-direction: column; gap: 6px; }
  .row {
    display: grid; grid-template-columns: 30px 1fr auto; align-items: center; gap: 10px;
    padding: 8px 10px; border-radius: 12px; background: transparent;
  }
  .row.last { background: color-mix(in srgb, var(--danger) 14%, transparent); }
  .rank {
    width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center;
    font-size: 12px; font-weight: 600; color: var(--muted);
    background: color-mix(in srgb, var(--text) 8%, transparent);
  }
  .row.top .rank { background: var(--accent); color: #fff; }
  @media (prefers-color-scheme: dark) { .row.top .rank { color: #0a1224; } }
  .row.last .rank { background: color-mix(in srgb, var(--danger) 30%, transparent); color: var(--danger); }
  .who { min-width: 0; }
  .name { font-weight: 500; display: flex; align-items: center; gap: 6px; }
  .name .crown { width: 14px; height: 14px; flex: none; }
  .row.last .name { color: var(--danger); }
  .when { color: var(--muted); font-size: 11.5px; }
  .time {
    font-variant-numeric: tabular-nums; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 15px;
  }
  .row.last .time { color: var(--danger); }
  .state { color: var(--muted); font-size: 13px; padding: 26px 4px; text-align: center; }
  .state.error { color: var(--danger); }
  code { background: color-mix(in srgb, var(--text) 8%, transparent); padding: 1px 5px; border-radius: 5px; font-size: 12px; }
  footer { color: var(--muted); font-size: 11.5px; text-align: center; margin-top: 26px; line-height: 1.7; }
  footer a { color: var(--accent); text-decoration: none; }
  footer a:hover { text-decoration: underline; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>EchoTimer 天梯榜</h1>
      <div class="sub" id="sub">正在读取…</div>
    </div>
    <div class="spacer"></div>
    <button id="refresh" type="button">刷新</button>
  </header>

  <div id="content"></div>

  <footer>
    数据来自仓库里的 NDJSON 文件，由 App 的「设置 → 数据同步」写入。<br>
    成绩只增不减；同一姓名以最好的一次为准。<br>
    EchoTimer · <a href="https://github.com/xushujin/echo-timer/blob/main/LICENSE" target="_blank" rel="noopener">Apache License 2.0</a>
  </footer>
</div>

<script>
(function () {
  // 默认值与 App 里「设置 → 数据同步」的默认路径保持一致。
  var DEFAULTS = {
    repo: 'xushujin/echo-timer',
    branch: 'main',
    path: 'echotimer/leaderboard.ndjson'
  };

  var params = new URLSearchParams(location.search);
  var cfg = {
    repo: params.get('repo') || DEFAULTS.repo,
    branch: params.get('branch') || DEFAULTS.branch,
    path: (params.get('path') || DEFAULTS.path).replace(/^\/+/, '')
  };

  var content = document.getElementById('content');
  var sub = document.getElementById('sub');
  var refresh = document.getElementById('refresh');

  var repoUrl = 'https://github.com/' + cfg.repo;
  var rawUrl = 'https://raw.githubusercontent.com/' + cfg.repo + '/' + cfg.branch + '/' + cfg.path;
  sub.textContent = '';
  var link = document.createElement('a');
  link.href = repoUrl; link.target = '_blank'; link.rel = 'noopener';
  link.textContent = cfg.repo + ' · ' + cfg.branch;
  sub.appendChild(link);
  sub.appendChild(document.createTextNode(' · ' + cfg.path));

  function showState(text, isError) {
    content.textContent = '';
    var div = document.createElement('div');
    div.className = 'state' + (isError ? ' error' : '');
    div.textContent = text;
    content.appendChild(div);
  }

  // 与 App 里的 ElapsedFormatter.clock 保持一致：mm:ss.SS，超过一小时用 h:mm:ss.SS。
  function formatTime(ms) {
    if (!isFinite(ms) || ms < 0) return '--:--.--';
    var total = Math.floor(ms);
    var centis = Math.floor((total % 1000) / 10);
    var seconds = Math.floor(total / 1000);
    var s = seconds % 60;
    var m = Math.floor(seconds / 60) % 60;
    var h = Math.floor(seconds / 3600);
    var pad = function (n, w) { var t = String(n); while (t.length < w) t = '0' + t; return t; };
    var tail = pad(m, 2) + ':' + pad(s, 2) + '.' + pad(centis, 2);
    return h > 0 ? h + ':' + tail : tail;
  }

  function formatWhen(epochMs) {
    if (!epochMs) return '';
    var d = new Date(epochMs);
    var pad = function (n) { return n < 10 ? '0' + n : String(n); };
    return (d.getMonth() + 1) + '月' + d.getDate() + '日 ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
  }

  function parseNdjson(text) {
    var boards = [];
    var entries = [];
    var updatedAt = 0;
    text.split('\n').forEach(function (line) {
      line = line.trim();
      if (!line || line.charAt(0) !== '{') return;
      var obj;
      try { obj = JSON.parse(line); } catch (e) { return; }
      if (!obj || typeof obj !== 'object') return;
      if (obj.type === 'meta') {
        updatedAt = Math.max(updatedAt, Number(obj.updatedAt) || 0);
      } else if (obj.type === 'board' && typeof obj.name === 'string') {
        boards.push({ name: obj.name.trim(), createdAt: Number(obj.createdAt) || 0 });
      } else if (obj.type === 'entry' && typeof obj.board === 'string' && typeof obj.player === 'string') {
        var best = Number(obj.bestMs);
        if (!isFinite(best) || best <= 0) return;
        entries.push({
          board: obj.board.trim(),
          player: obj.player.trim(),
          bestMs: best,
          updatedAt: Number(obj.updatedAt) || 0
        });
      }
    });
    return { boards: boards, entries: entries, updatedAt: updatedAt };
  }

  function crownSvg() {
    var svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('viewBox', '0 0 24 24');
    svg.setAttribute('class', 'crown');
    var path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    path.setAttribute('fill', 'currentColor');
    path.setAttribute('d', 'M3 8l4.2 3.2L12 4l4.8 7.2L21 8l-1.6 10H4.6z');
    svg.appendChild(path);
    return svg;
  }

  function render(data) {
    var byBoard = {};
    data.entries.forEach(function (entry) {
      var key = entry.board.toLowerCase();
      if (!byBoard[key]) byBoard[key] = { name: entry.board, createdAt: 0, rows: [] };
      byBoard[key].rows.push(entry);
    });
    data.boards.forEach(function (board) {
      var key = board.name.toLowerCase();
      if (!byBoard[key]) byBoard[key] = { name: board.name, createdAt: 0, rows: [] };
      byBoard[key].createdAt = board.createdAt;
    });

    var list = Object.keys(byBoard).map(function (k) { return byBoard[k]; });
    if (!list.length) {
      showState('还没有数据。先在 App 的「设置 → 数据同步」里点一次「立即同步」。');
      return;
    }
    list.sort(function (a, b) {
      if (b.createdAt !== a.createdAt) return b.createdAt - a.createdAt;
      return a.name.localeCompare(b.name, 'zh-Hans-CN');
    });

    content.textContent = '';
    list.forEach(function (board) {
      board.rows.sort(function (a, b) {
        if (b.bestMs !== a.bestMs) return b.bestMs - a.bestMs;
        return a.updatedAt - b.updatedAt;
      });

      var card = document.createElement('section');
      card.className = 'card';

      var head = document.createElement('div');
      head.className = 'board-head';
      var name = document.createElement('div');
      name.className = 'board-name';
      name.textContent = board.name;
      var meta = document.createElement('div');
      meta.className = 'board-meta';
      meta.textContent = board.rows.length
        ? board.rows.length + ' 人 · 最佳 ' + formatTime(board.rows[0].bestMs)
        : '暂无成绩';
      head.appendChild(name);
      head.appendChild(meta);
      card.appendChild(head);

      var rows = document.createElement('div');
      rows.className = 'rows';
      board.rows.forEach(function (entry, index) {
        var row = document.createElement('div');
        row.className = 'row';
        if (index === 0) row.className += ' top';
        if (index === board.rows.length - 1 && board.rows.length > 1) row.className += ' last';

        var rank = document.createElement('div');
        rank.className = 'rank';
        rank.textContent = String(index + 1);

        var who = document.createElement('div');
        who.className = 'who';
        var nameLine = document.createElement('div');
        nameLine.className = 'name';
        nameLine.appendChild(document.createTextNode(entry.player));
        if (index === 0) nameLine.appendChild(crownSvg());
        var when = document.createElement('div');
        when.className = 'when';
        when.textContent = formatWhen(entry.updatedAt);
        who.appendChild(nameLine);
        who.appendChild(when);

        var time = document.createElement('div');
        time.className = 'time';
        time.textContent = formatTime(entry.bestMs);

        row.appendChild(rank);
        row.appendChild(who);
        row.appendChild(time);
        rows.appendChild(row);
      });
      card.appendChild(rows);
      content.appendChild(card);
    });

    if (data.updatedAt) {
      var stamp = document.createElement('div');
      stamp.className = 'state';
      stamp.textContent = '最后同步：' + formatWhen(data.updatedAt);
      content.appendChild(stamp);
    }
  }

  async function load() {
    refresh.disabled = true;
    showState('正在读取仓库…');
    try {
      var res = await fetch(rawUrl + '?t=' + Date.now(), { cache: 'no-store' });
      if (res.status === 404) {
        showState('仓库里还没有这个文件。先在 App 里点一次「立即同步」。');
        return;
      }
      if (!res.ok) {
        showState('读取失败（HTTP ' + res.status + '）。仓库或分支填错时会这样。', true);
        return;
      }
      var text = await res.text();
      render(parseNdjson(text));
    } catch (e) {
      showState('读取失败：' + (e && e.message ? e.message : '网络错误'), true);
    } finally {
      refresh.disabled = false;
    }
  }

  refresh.addEventListener('click', load);
  load();
})();
</script>
</body>
</html>
