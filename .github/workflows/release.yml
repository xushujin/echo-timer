name: Release

# 只由 tag 推送触发（v*）：跑单测 → 构建签名 APK → 校验签名与清单 → 创建 GitHub Release。
# 推分支 / 开 PR 不会触发本工作流，也不会产出 APK。
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # --generate-notes 需要历史 tag 才能算出变更范围
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Verify tag matches versionName
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          GRADLE_VERSION="$(sed -n 's/^val appVersionName = "\(.*\)"/\1/p' app/build.gradle.kts)"
          echo "tag=$TAG_VERSION gradle=$GRADLE_VERSION"
          if [ "$TAG_VERSION" != "$GRADLE_VERSION" ]; then
            echo "::error::tag $GITHUB_REF_NAME 与 app/build.gradle.kts 的 versionName $GRADLE_VERSION 不一致"
            exit 1
          fi

      - name: Restore keystore
        env:
          ECHO_KEYSTORE_BASE64: ${{ secrets.ECHO_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${ECHO_KEYSTORE_BASE64:-}" ]; then
            echo "::error::缺少 secret ECHO_KEYSTORE_BASE64"
            exit 1
          fi
          mkdir -p release-keystore
          printf '%s' "$ECHO_KEYSTORE_BASE64" | base64 -d > release-keystore/echotimer-release.jks
          ls -l release-keystore/echotimer-release.jks

      - name: Unit tests, lint and signed release build
        env:
          ECHO_STORE_FILE: release-keystore/echotimer-release.jks
          ECHO_STORE_PASSWORD: ${{ secrets.ECHO_STORE_PASSWORD }}
          ECHO_KEY_ALIAS: ${{ secrets.ECHO_KEY_ALIAS }}
          ECHO_KEY_PASSWORD: ${{ secrets.ECHO_KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon --stacktrace \
            testReleaseUnitTest \
            lintRelease \
            distReleaseApk

      - name: Verify APK (signature, manifest, permissions)
        run: |
          set -euo pipefail
          APK="build/dist/EchoTimer.apk"
          echo "APK=$APK"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$APKSIGNER" verify --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging "$APK" | head -n 20
          unzip -l "$APK" | head -n 20
          sha256sum "$APK" | tee "$APK.sha256"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            build/dist/EchoTimer.apk \
            build/dist/EchoTimer.apk.sha256 \
            --title "EchoTimer ${GITHUB_REF_NAME}" \
            --generate-notes
