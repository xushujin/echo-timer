name: Release

# 只由 tag 推送触发（v*）：跑单测 → 构建签名 APK → 校验签名与清单 → 创建 GitHub Release。
# 推分支 / 开 PR 不会触发本工作流，也不会产出 APK。
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # --generate-notes 需要历史 tag 才能算出变更范围
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # 不用 android-actions/setup-android：它会执行 sdkmanager tools，而 tools 包已下架，
      # 在新版 cmdline-tools 上必然失败（Failed to find package 'tools'）。这里直接装配 SDK。
      - name: Set up Android SDK
        env:
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          # runner 镜像自带 cmdline-tools/16.0；没有时下载一份
          if [ ! -d "$ANDROID_SDK_ROOT/cmdline-tools" ]; then
            mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
            curl -sSL -o /tmp/cmdline-tools.zip \
              https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
            unzip -q /tmp/cmdline-tools.zip -d /tmp/cmdline-tools
            mv /tmp/cmdline-tools/cmdline-tools "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          fi
          for dir in "$ANDROID_SDK_ROOT"/cmdline-tools/*/bin; do
            echo "$dir" >> "$GITHUB_PATH"
          done

      - name: Install SDK packages
        run: |
          set -euo pipefail
          sdkmanager --version
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Verify tag matches versionName
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          GRADLE_VERSION="$(sed -n 's/^val appVersionName = "\(.*\)"/\1/p' app/build.gradle.kts)"
          echo "tag=$TAG_VERSION gradle=$GRADLE_VERSION"
          if [ "$TAG_VERSION" != "$GRADLE_VERSION" ]; then
            echo "::error::tag $GITHUB_REF_NAME 与 app/build.gradle.kts 的 versionName $GRADLE_VERSION 不一致"
            exit 1
          fi

      - name: Restore keystore
        env:
          ECHO_KEYSTORE_BASE64: ${{ secrets.ECHO_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${ECHO_KEYSTORE_BASE64:-}" ]; then
            echo "::error::缺少 secret ECHO_KEYSTORE_BASE64"
            exit 1
          fi
          mkdir -p release-keystore
          printf '%s' "$ECHO_KEYSTORE_BASE64" | base64 -d > release-keystore/echotimer-release.jks
          ls -l release-keystore/echotimer-release.jks

      - name: Unit tests, lint and signed release build
        env:
          ECHO_STORE_FILE: release-keystore/echotimer-release.jks
          ECHO_STORE_PASSWORD: ${{ secrets.ECHO_STORE_PASSWORD }}
          ECHO_KEY_ALIAS: ${{ secrets.ECHO_KEY_ALIAS }}
          ECHO_KEY_PASSWORD: ${{ secrets.ECHO_KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon --stacktrace \
            testReleaseUnitTest \
            lintRelease \
            distReleaseApk

      - name: Verify APK (signature, manifest, permissions)
        run: |
          set -euo pipefail
          APK="$(ls build/dist/EchoTimer-v*.apk | head -n 1)"
          echo "APK=$APK"
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/36.0.0/apksigner)"
          "$APKSIGNER" verify --print-certs "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging "$APK" | head -n 20
          unzip -l "$APK" | head -n 20
          sha256sum "$APK" | tee "$APK.sha256"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="$GITHUB_REF_NAME"
          APK_FILE="$(ls build/dist/EchoTimer-v*.apk | head -n 1)"
          if gh release view "$TAG" > /dev/null 2>&1; then
            # 已存在（例如手动建过）时只补传产物，避免 "release already exists" 导致整次失败
            echo "release $TAG 已存在，上传产物并覆盖同名文件"
            gh release upload "$TAG" \
              "$APK_FILE" \
              "$APK_FILE.sha256" \
              --clobber
          else
            gh release create "$TAG" \
              "$APK_FILE" \
              "$APK_FILE.sha256" \
              --title "EchoTimer $TAG" \
              --generate-notes
          fi
